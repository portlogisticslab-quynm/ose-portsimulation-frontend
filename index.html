      <div>
        <div class="brand-name">Port Simulation</div>
        <div class="brand-sub">Suite · Web 2.1</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-page="dashboard"><span class="ico">◧</span><span data-i18n="nav.dashboard"></span></a>
      <a href="#/inputs" data-page="inputs"><span class="ico">▤</span><span data-i18n="nav.inputs"></span></a>
      <a href="#/run" data-page="run"><span class="ico">▶</span><span data-i18n="nav.run"></span></a>

      <div class="copyright">© 2026 portlogistics.vn</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <label class="run-picker api-picker" id="apiPicker"><span class="api-ico" aria-hidden="true">⇅</span>
          <select id="apiSelect" aria-label="Backend" data-i18n-title="srv.title">

            <option value="home" data-i18n="srv.home">Home server</option>
            <option value="render" data-i18n="srv.render">Render</option>
          </select>
        </label>
        <label class="run-picker"><span data-i18n="top.result"></span>
          <select id="runSelect"></select>
        </label>
        <div class="seg" id="langSeg"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
        <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
      </div>
    </header>
    <main id="view" class="view"></main>
